<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="300" fill="#f8fafc" rx="14"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">🖧  Mininet Topology — Custom OpenFlow 1.3</text>
  <line x1="40" y1="48" x2="720" y2="48" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ═══ HOSTS (top) ═══ -->
  <!-- h1 -->
  <rect x="80" y="70" width="80" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="96" text-anchor="middle" font-size="20">💻</text>
  <text x="120" y="115" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">h1</text>
  <text x="120" y="128" text-anchor="middle" fill="#86efac" font-size="8">10.0.0.1</text>

  <!-- h2 -->
  <rect x="330" y="70" width="80" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="370" y="96" text-anchor="middle" font-size="20">💻</text>
  <text x="370" y="115" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">h2</text>
  <text x="370" y="128" text-anchor="middle" fill="#86efac" font-size="8">10.0.0.2</text>

  <!-- h3 -->
  <rect x="580" y="70" width="80" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="620" y="96" text-anchor="middle" font-size="20">💻</text>
  <text x="620" y="115" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">h3</text>
  <text x="620" y="128" text-anchor="middle" fill="#86efac" font-size="8">10.0.0.3</text>

  <!-- ═══ VERTICAL LINKS hosts → switches ═══ -->
  <line x1="120" y1="130" x2="120" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <line x1="370" y1="130" x2="370" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="130" x2="620" y2="178" stroke="#94a3b8" stroke-width="2"/>

  <!-- ═══ SWITCHES (middle) ═══ -->
  <!-- s1 -->
  <rect x="70" y="180" width="100" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="120" y="207" text-anchor="middle" font-size="20">🔀</text>
  <text x="120" y="227" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">s1</text>
  <text x="120" y="241" text-anchor="middle" fill="#93c5fd" font-size="8">OVS Switch</text>

  <!-- s2 -->
  <rect x="320" y="180" width="100" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="370" y="207" text-anchor="middle" font-size="20">🔀</text>
  <text x="370" y="227" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">s2</text>
  <text x="370" y="241" text-anchor="middle" fill="#93c5fd" font-size="8">OVS Switch</text>

  <!-- s3 -->
  <rect x="570" y="180" width="100" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="620" y="207" text-anchor="middle" font-size="20">🔀</text>
  <text x="620" y="227" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="700">s3</text>
  <text x="620" y="241" text-anchor="middle" fill="#93c5fd" font-size="8">OVS Switch</text>

  <!-- ═══ HORIZONTAL LINKS s1—s2—s3 ═══ -->
  <line x1="170" y1="212" x2="320" y2="212" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="420" y1="212" x2="570" y2="212" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Link labels -->
  <rect x="210" y="200" width="70" height="18" rx="4" fill="#dbeafe"/>
  <text x="245" y="213" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="600">s1-eth2:s2-eth2</text>
  <rect x="460" y="200" width="70" height="18" rx="4" fill="#dbeafe"/>
  <text x="495" y="213" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="600">s2-eth3:s3-eth2</text>

  <!-- ═══ ODL Controller badge ═══ -->
  <rect x="270" y="265" width="220" height="26" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="380" y="282" text-anchor="middle" fill="#713f12" font-size="10" font-weight="600">⚙  ODL Controller — 127.0.0.1:6653 (OpenFlow 1.3)</text>

  <!-- dashed lines from each switch to controller -->
  <line x1="120" y1="245" x2="310" y2="272" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="370" y1="245" x2="380" y2="265" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="620" y1="245" x2="460" y2="272" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- pingall result badge -->
  <rect x="570" y="265" width="160" height="26" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="650" y="282" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">✅ pingall: 0% dropped</text>
</svg>
